<!DOCTYPE html>
<html>
<head>
  <title>Pope</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: black;
    }
  </style>
</head>
<body>

<video id="video" autoplay muted playsinline controls>
  <source src="pope.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById("video");

document.body.addEventListener("click", () => {
  video.muted = false;
  video.volume = 1;
  video.play();
}, { once: true });
</script>

</body>
</html>
